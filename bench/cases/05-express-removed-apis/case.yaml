id: 05-express-removed-apis
title: express 4 to 5 (app.del, req.param and res.json(status, body) were removed)
type: breaking
package: express
from: 4.22.3
to: 5.3.0
test_command: npm test
# Where the change is documented. Each quote was read from the page on 2026-10-10.
sources:
  - url: https://github.com/expressjs/express/blob/master/History.md
    quote: "`app.del` - use `app.delete`; `req.param()` -- use `req.params`, `req.body`, or `req.query` instead; `res.json(status, obj)` signature - use `res.status(status).json(obj)`"
  - url: https://expressjs.com/en/guide/migrating-5.html
    quote: "Express 5 no longer supports the app.del() function."
advisories: []
expected:
  verdict: affected
  finding_kind: breaking
  fixable: true
  affected_files:
    - src/app.js
    - src/routes/items.js
